name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockpulse_release?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stockpulse_release"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and main ancestry
        env:
          STOCKPULSE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run release:check
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit already contained in main." >&2
            exit 1
          }

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Run type checks, lint, and tests
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Generate production dependency SBOM
        run: |
          mkdir -p release-artifacts
          SBOM="release-artifacts/stockpulse-${GITHUB_REF_NAME}-sbom.cdx.json"
          npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > "$SBOM"
          sha256sum "$SBOM" > "$SBOM.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTES="docs/RELEASE_NOTES_v${VERSION}.md"
          SBOM="release-artifacts/stockpulse-${GITHUB_REF_NAME}-sbom.cdx.json"
          RELEASE_ARGS=(
            "$GITHUB_REF_NAME"
            "$SBOM"
            "$SBOM.sha256"
            --verify-tag
            --title "StockPulse $GITHUB_REF_NAME"
            --notes-file "$NOTES"
          )
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
